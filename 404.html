<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Lucas Bernardeau</title>
    <meta name="description" content="Oops, this page doesn't exist.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/doc/favicon-32x32.png">
    <link rel="shortcut icon" href="/doc/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Soul Daisy';
            src: url('/fonts/soul-daisy.regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Soul Daisy', sans-serif;
            background: #f4f4f4;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .error-code {
            font-family: 'Soul Daisy', sans-serif;
            font-size: 8rem;
            color: #f39c12;
            line-height: 1;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.05); opacity: 0.85; }
        }

        h1 {
            font-family: 'Soul Daisy', sans-serif;
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 500px;
            line-height: 1.6;
        }

        .gif-box {
            width: 220px;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            background: #fff;
        }

        .gif-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-family: -apple-system, sans-serif;
            font-size: 0.95rem;
            transition: transform 0.2s, background 0.2s;
            border: 2px solid #333;
        }

        .btn-primary {
            background: #333;
            color: #fff;
        }
        .btn-primary:hover {
            background: #555;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #fff;
            color: #333;
        }
        .btn-secondary:hover {
            background: #f39c12;
            color: #fff;
            border-color: #f39c12;
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #aaa;
            font-family: -apple-system, sans-serif;
        }

        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            h1 { font-size: 1.4rem; }
            .gif-box { width: 160px; height: 160px; }
        }
    </style>
</head>

<body>

    <div class="error-code">404</div>
    <h1>Oops, this page got lost.</h1>
    <p>
        The page you're looking for doesn't exist (or was moved).
        Maybe you took a wrong turn somewhere on the internet.
    </p>

    <div class="gif-box">
        <img src="https://media.giphy.com/media/l0IylOPCNkiqOgMyA/giphy.gif" alt="404">
    </div>

    <div class="buttons">
        <a href="./html/index.html" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> Go Home
        </a>
        <a href="./html/projects.html" class="btn btn-secondary">
            <i class="fa-solid fa-code"></i> See Projects
        </a>
    </div>

    <div class="footer-note">
        © 2026 Buzzcut. All rights reserved.
    </div>

</body>

</html>
